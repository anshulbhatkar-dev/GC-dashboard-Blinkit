  if(n>=1e7)return s+'₹'+(n/1e7).toFixed(d)+'Cr';
  if(n>=1e5)return s+'₹'+(n/1e5).toFixed(d)+'L';
  if(n>=1e3)return s+'₹'+(n/1e3).toFixed(0)+'k';
  return s+'₹'+n.toFixed(0);
};

  if(schg!=null&&schg>0&&td){atxt=`Gained from <b>${td[0]}</b> (${fPp(-td[1])} to us)${_whyGained()}`;acls='pos';}
  else if(schg!=null&&schg<=0&&tg){atxt=`Lost to <b>${tg[0]}</b> (+${fPp(tg[1])} to them)${_whyLost()}`;acls='neg';}
  else if(schg!=null&&schg>0){atxt=`Share gained — diffuse (no single donor above 0.1%)${_whyGained()}`;acls='pos';}
  else{atxt=`No dominant share movement detected`;acls='neu';}

  // Our brand signal badges (deltas already computed above as _oad/_oor/_osa_d/_disc_d)
  const oad=_oad, oor=_oor, osa_d=_osa_d, disc_d=_disc_d;
  let bdg='';
  if(Math.abs(oad)>1.5)bdg+=`<span class="badge ${oad>0?'bg':'br'}">Ad SOV ${oad>0?'▲':'▼'} to ${om.ad_sov?.toFixed(1)}% (${fPp(oad)})</span>`;
  if(Math.abs(oor)>1.5)bdg+=`<span class="badge ${oor>0?'bg':'by'}">Org SOV ${oor>0?'▲':'▼'} to ${om.org_sov?.toFixed(1)}% (${fPp(oor)})</span>`;
  if(Math.abs(osa_d)>1.5)bdg+=`<span class="badge ${osa_d>0?'bg':'by'}">OSA ${osa_d>0?'improved':'declined'} to ${om.osa?.toFixed(0)}% (${fPp(osa_d)})</span>`;
  if(disc_d>0.5)bdg+=`<span class="badge by">Discount deepened to ${om.discount?.toFixed(1)}% (${fPp(disc_d)})</span>`;
  if(disc_d<-0.5)bdg+=`<span class="badge bb">Discount eased to ${om.discount?.toFixed(1)}% (${fPp(disc_d)})</span>`;

  // Attribution sub-text — our metrics context
  const ourCtx=`Ad SOV ${om.ad_sov?.toFixed(1)||'—'}% (was ${ol.ad_sov?.toFixed(1)||'—'}%) · Org ${om.org_sov?.toFixed(1)||'—'}% (was ${ol.org_sov?.toFixed(1)||'—'}%) · OSA ${om.osa?.toFixed(0)||'—'}% · Disc ${om.discount?.toFixed(1)||'—'}%`;
  const noDriver=!bdg&&schg!=null&&Math.abs(schg)<0.5;

  // Comp card
  const csc=csm!=null&&csl!=null?csm-csl:null;
  const cod=(cm.osa||0)-(cl.osa||0);
  const cad=(cm.ad_sov||0)-(cl.ad_sov||0);
  let cbdg='';
  if(Math.abs(csc||0)>0.5)cbdg+=`<span class="badge ${csc>0?'br':'bg'}">${d.comp} share ${csc>0?'gained':'lost'} ${fPp(csc)}</span>`;
  if(cd&&cd.metric){
    const cdm=cd.metric,del=cd.delta||0;
    if(Math.abs(del)>1)cbdg+=`<span class="badge ${del>0?'by':'bb'}">${cdm} ${del>0?'▲':'▼'} ${del>0?'+':''}${del.toFixed(1)} (driver)</span>`;
  }
  if(Math.abs(cod)>2)cbdg+=`<span class="badge ${cod>0?'br':'bg'}">Their OSA ${cod>0?'▲':'▼'} to ${cm.osa?.toFixed(0)}% (${fPp(cod)})</span>`;
  if(Math.abs(cad)>1.5)cbdg+=`<span class="badge ${cad>0?'br':'bg'}">Their Ad SOV ${cad>0?'▲':'▼'} to ${cm.ad_sov?.toFixed(1)}% (${fPp(cad)})</span>`;


  // Category snapshot strip
  const snap_sc=osm!=null&&osl!=null?osm-osl:null;
  const snap_mc=pct(d.mm,d.ml);
  const worst_ci=d.ci&&d.ci.length?d.ci.reduce((a,b)=>((a.our_mtd_chg||0)<(b.our_mtd_chg||0)?a:b)):null;
  const snap_badges=[];
  if(Math.abs(oad)>1.5)snap_badges.push(`<span style="font-size:10px;padding:2px 6px;border-radius:3px;background:${oad>0?'#dcfce7':'#fee2e2'};color:${oad>0?'#16a34a':'#dc2626'}">Ad SOV ${oad>0?'▲':'▼'}</span>`);
  if(Math.abs(osa_d)>1.5)snap_badges.push(`<span style="font-size:10px;padding:2px 6px;border-radius:3px;background:${osa_d>0?'#dcfce7':'#fef3c7'};color:${osa_d>0?'#16a34a':'#d97706'}">OSA ${osa_d>0?'▲':'▼'}</span>`);
  h+=`<div style="display:flex;gap:16px;padding:8px 14px;background:#f0f9ff;border-bottom:2px solid #bae6fd;flex-wrap:wrap;align-items:center">
    <div style="font-size:11px">Share: <b class="${clr(snap_sc)}">${fP(osm)} (${fPp(snap_sc)})</b></div>
    <div style="font-size:11px">Market: <b class="${clr(snap_mc)}">${fI(d.mm)}/day (${fCh(snap_mc)})</b></div>
    <div style="font-size:11px">Comp: <b>${d.comp} — ${fP(csm)} (${fPp(csm!=null&&csl!=null?csm-csl:null)})</b></div>
    ${worst_ci?`<div style="font-size:11px">⚠ City watch: <b>${worst_ci.city}</b> ${fPp(worst_ci.our_mtd_chg)} share</div>`:''}
    <div style="margin-left:auto;display:flex;gap:4px">${snap_badges.join('')}</div>
  </div>`;
  const atScope=at.scope?`<span style="font-size:10px;color:#6b7280;font-weight:normal;margin-left:6px">(scoped to ${at.scope})</span>`:'';
  h+=`<div class="attr-row">
    <div class="acard">
      <div class="atitle ${acls}">${atxt}${atScope}</div>
      <div class="asub">${ourCtx}</div>
      ${noDriver?'<div class="asub" style="margin-top:4px;color:#d97706">⚠ No single clear driver — share change within noise range</div>':''}
      <div class="badges">${bdg||'<span style="font-size:11px;color:#9ca3af">No signal threshold crossed</span>'}</div>
    </div>
    <div class="acard">
      <div class="atitle">👁 ${d.comp} — always watch</div>
      <div class="asub">
        Off/day ${fI(cm.offtake)} · Units ${fU(cm.units)}/day<br>
        OSA ${cm.osa?.toFixed(0)||'—'}% · Disc ${cm.discount?.toFixed(1)||'—'}%<br>
        Ad SOV ${cm.ad_sov?.toFixed(1)||'—'}% (was ${cl.ad_sov?.toFixed(1)||'—'}%)
      </div>
      <div class="badges">${cbdg||'<span style="font-size:11px;color:#9ca3af">Holding steady</span>'}</div>
    </div>
  </div>`;

  // ── Brands outperforming us this MTD ─────────────────────────────────
  const ops=at.outperformers||[];
  if(ops.length){
    h+=`<div class="op-row">
      <div class="op-title">⚡ Brands gaining more share than us this MTD (our gain: ${fPp(at.our_gain)})</div>`;
    ops.forEach(op=>{
      const drv=op.driver;
      let reason='Reason unclear';
      if(drv&&drv.metric){const u=drv.metric.includes('SOV')||drv.metric==='OSA'?'%':'';reason=drv.metric+' '+(drv.delta>0?'▲':'▼')+' '+drv.lmtd+u+'→'+drv.mtd+u;}
      h+=`<span class="op-item"><b>${op.brand}</b> <span class="pos">+${op.gain.toFixed(2)}%</span> — ${reason}</span>`;
    });
    h+=`</div>`;
  }

  // ── Cross-channel + search ────────────────────────────────────────────
  const sr=d.sr||{};
  const amChg=pct(d.am,d.al),dmChg=pct(d.dm,d.dl);
  h+=`<div class="xc">
    📡 <b>Cross-channel</b>:
    Amz DRR ${fU(d.am)} <span class="${clr(amChg)}">${amChg!=null?fCh(amChg):''}</span> MTD
    &nbsp;·&nbsp; D2C DRR ${fU(d.dm)} <span class="${clr(dmChg)}">${dmChg!=null?fCh(dmChg):''}</span> MTD`;
  if(sr.gen_m){
    h+=`<br>🔍 <b>Search — MTD vs LMTD</b>:
      Generic ${sr.gen_m?.toLocaleString()||'—'}/day (LMTD ${sr.gen_l?.toLocaleString()||'—'}) <span class="${clr(sr.gen_chg)}">${sr.gen_chg!=null?fCh(sr.gen_chg,0):''}</span>
      &nbsp;·&nbsp; Brand ${sr.brd_m?.toLocaleString()||'—'}/day (LMTD ${sr.brd_l?.toLocaleString()||'—'}) <span class="${clr(sr.brd_chg)}">${sr.brd_chg!=null?fCh(sr.brd_chg,0):''}</span>
      &nbsp;·&nbsp; ${sr.comp||d.comp} ${sr.cmp_m?.toLocaleString()||'—'}/day <span class="${clr(sr.cmp_chg)}">${sr.cmp_chg!=null?fCh(sr.cmp_chg,0):''}</span>`;
  }
  h+=`</div>`;

  // ── Top SKUs — 1 own top seller + top (n-1) competitor SKUs ──────────
  const ot=d.ot||[];
  if(ot.length){
    // Reference: our top SKU's growth rates (benchmark for red-flag logic)
    const ourRef=ot.find(s=>s.is_own)||null;
    const refMTD=ourRef?.vs_lmtd??null;
    const refWoW=ourRef?.wow??null;
    h+=`<div class="sec-lbl">Top SKUs — ${d.cat} category · top 2 own SKUs + competitors · 🔴 beats our top seller</div>
      <div class="ov"><table class="t"><thead><tr>
        <th style="text-align:left;width:34%">SKU</th>
        <th style="text-align:left;width:13%">Brand</th>
        <th>PPU/100ml</th><th>Avg/day</th><th>Peak/day</th><th>WoW</th><th>vs LMTD</th>
      </tr></thead><tbody>`;
    ot.forEach(s=>{
      const io=s.is_own;
      // Red flag: competitor growing faster than our top SKU on either WoW or LMTD
      const beatsMTD=!io&&s.vs_lmtd!=null&&refMTD!=null&&s.vs_lmtd>refMTD;
      const beatsWoW=!io&&s.wow!=null&&refWoW!=null&&s.wow>refWoW;
      const warn=beatsMTD||beatsWoW;
      const tip=`${(s.name||'')}\nBrand: ${s.brand}\nPPU: ₹${s.ppu||'?'}/100ml  SP: ₹${s.avg_sp||'?'}\nAvg/day: ${fU(s.avg)}  Peak: ${fU(s.peak)}\nWoW: ${fCh(s.wow??null)}  vs LMTD: ${fCh(s.vs_lmtd??null)}`;
      const warnTag=warn?`<span style="font-size:9px;background:#fee2e2;color:#dc2626;padding:1px 4px;border-radius:3px;margin-left:4px">🔴 beats us</span>`:'';
      h+=`<tr class="${io?'own':warn?'warn':''}">
        <td><a href="https://blinkit.com/prn/dp/prid/${s.pid}" target="_blank"
             title="${tip}"
             style="font-size:11px">${(s.name||'').substring(0,50)}</a>${warnTag}</td>
        <td style="font-size:11px;${io?'color:#1d4ed8;font-weight:700':'color:#6b7280'}">${s.brand}${io?' <span style=\"font-size:9px;background:#dbeafe;color:#1d4ed8;padding:1px 4px;border-radius:3px\">★ us</span>':''}</td>
        <td>₹${s.ppu||'—'}</td>
        <td><b>${fU(s.avg)}</b></td><td>${fU(s.peak)}</td>
        <td><span class="${beatsWoW&&!io?'neg':clr(s.wow)}">${fCh(s.wow??null)}</span></td>
        <td><span class="${beatsMTD&&!io?'neg':clr(s.vs_lmtd)}">${fCh(s.vs_lmtd??null)}</span></td>
      </tr>`;
    });
    h+=`</tbody></table></div>`;
  }

  // ── Top Brands ──────────────────────────────────────────────────────────
  const tb=(d.tb||[]);
  if(tb.length){
    h+=`<div class="sec-lbl">Top Brands — ${d.cat} · ranked by avg Offtake/day (MTD)</div>
      <div class="ov"><table class="t"><thead><tr>
        <th style="text-align:left;width:26%">Brand</th>
        <th>Share MTD</th><th>vs LMTD</th>
        <th>Off/day MTD</th><th>vs LMTD</th>
        <th>Units/day</th><th>OSA%</th><th>PPU/100ml</th>
      </tr></thead><tbody>`;
    tb.forEach(b=>{
      const sc=b.share_mtd!=null&&b.share_lmtd!=null?b.share_mtd-b.share_lmtd:null;
      const oc=pct(b.off_mtd,b.off_lmtd);
      h+=`<tr class="${b.is_own?'own':''}">
        <td style="${b.is_own?'color:#1d4ed8;font-weight:700':''}">
          ${b.brand}${b.is_own?' <span class="ob">US</span>':''}
        </td>
        <td><b>${fP(b.share_mtd)}</b></td>
        <td><span class="${clr(sc)}">${fPp(sc)}</span></td>
        <td>${fI(b.off_mtd)}</td>
        <td><span class="${clr(oc)}">${fCh(oc)}</span></td>
        <td>${fU(b.units_mtd)}</td>
        <td>${fP(b.osa,0)}</td>
        <td>₹${b.ppu||'—'}</td>
      </tr>`;
    });
    h+=`</tbody></table></div>`;
  }

  // ── Watch Out ───────────────────────────────────────────────────────────
  const wl=(d.wl||[]);
  const awItems=wl.filter(w=>w.always_watch);
  const challPrem=wl.filter(w=>!w.always_watch&&!w.mass).sort((a,b)=>a.dist-b.dist);
  const challMass=wl.filter(w=>!w.always_watch&&w.mass).sort((a,b)=>a.dist-b.dist);
  const woTbl=(items,lbl,isAw=false)=>{
    if(!items.length)return'';
    return`<div class="wo-gl">${lbl}</div>
      <div class="ov"><table class="t"><thead><tr>
        <th style="text-align:left;width:36%">SKU</th>
        <th style="text-align:left;width:11%">Brand</th>
        <th>PPU/100ml</th><th>Avg SP</th><th>DRR/day</th><th>Peak/day</th>
        <th>MTD vs LMTD</th>
      </tr></thead><tbody>
      ${items.map(w=>`<tr${isAw?' style="background:#eff6ff"':''}>
        <td><a href="https://blinkit.com/prn/dp/prid/${w.pid}" target="_blank" style="font-size:11px">${(w.name||'').substring(0,48)}</a></td>
        <td style="font-size:11px;color:${isAw?'#1d4ed8':'#6b7280'};font-weight:${isAw?'600':'normal'}">${w.brand}${isAw?'<span style="font-size:9px;background:#dbeafe;color:#1d4ed8;padding:1px 4px;border-radius:3px;margin-left:4px">👁</span>':''}</td>
        <td>₹${w.ppu||'—'}</td>
        <td>₹${w.avg_sp||'—'}</td>
        <td>${fU(w.u_m)}</td><td>${fU(w.peak)||'—'}</td>
        <td><span class="${clr(w.gr)}">${fCh(w.gr??null)}</span></td>
      </tr>`).join('')}
      </tbody></table></div>`;
  };
  if(wl.length){
    h+=`<div class="sec-lbl">Watch Out — 👁 <b>${d.comp}</b> always tracked · Others: growing faster than us (DRR ≥ 30) · Our PPU: ₹${om.ppu||'—'}/100ml</div>`;
    if(awItems.length)h+=woTbl(awItems,`👁 ${d.comp} — always watch (every MTD)`,true);
    if(challPrem.length)h+=woTbl(challPrem,'Premium challengers growing faster than us (PPU ≥ 60% of ours)');
    if(challMass.length)h+=woTbl(challMass,'Mass brands growing faster than us (PPU < 60% of ours)');
  }

  // ── City anomalies ──────────────────────────────────────────────────────
  const ci=(d.ci||[]).slice(0,8);
  if(ci.length){
    const FLAG_TXT={green:'🔺 We are gaining',red:'🔻 We are losing',orange:'⚠ Comp gaining',blue:'✅ Comp retreating'};
    h+=`<div class="sec-lbl">City Anomalies — share pp change by city (MTD vs LMTD), ranked by Pan India %</div>
      <div class="ov"><table class="t"><thead><tr>
        <th style="text-align:left;width:18%">City</th>
        <th>Pan India %</th><th>Our share chg</th>
        <th>${d.comp} share shift</th><th style="text-align:left">Status</th>
      </tr></thead><tbody>
      ${ci.map(c=>`<tr>
        <td style="font-weight:bold">${c.city}</td>
        <td>${c.mkt_pct?.toFixed(1)||'—'}% of market</td>
        <td><span class="${clr(c.our_mtd_chg)}">${fPp(c.our_mtd_chg)}</span> <span style='font-size:10px;color:#6b7280'>(${c.our_share_mtd?.toFixed(1)||'—'}%)</span></td>
        <td><span class="${clr(c.comp_shift)}">${fPp(c.comp_shift)}</span></td>
        <td><span style="font-size:10px;padding:2px 7px;border-radius:4px;
          background:${c.flag==='green'?'#dcfce7':c.flag==='red'?'#fee2e2':'#fef3c7'};
          color:${c.flag==='green'?'#16a34a':c.flag==='red'?'#dc2626':'#d97706'}">
          ${FLAG_TXT[c.flag]||c.flag}</span></td>
      </tr>`).join('')}
      </tbody></table></div>`;
  }

  h+=`</div>`;return h;
}

// ── TIER 2 (medium) ──────────────────────────────────────────────────────
function t2(d){
  const om=d.om||{},ol=d.ol||{},ow2=d.ow2||{},ow1=d.ow1||{};
  const cm=d.cm||{},cl=d.cl||{},sr=d.sr||{};
  const sc=om.share!=null&&ol.share!=null?om.share-ol.share:null;
  const wd=ow2.share!=null&&ow1.share!=null?ow2.share-ow1.share:null;
  const ws=wd!=null&&sc!=null?(wd>sc+0.5?'ACCEL':wd<sc-0.5?'DECEL':'STABLE'):null;
  const ot=d.ot||[],top=ot[0];
  let h=`<div class="card"><div class="card-hdr">
    <div><span class="cat-name">${d.cat}</span><span class="brand-tag">${d.ob}</span></div>
    <div class="ppu-line">Our PPU: <span class="ppu-ours">₹${om.ppu||'—'}/100ml</span>
    &nbsp;·&nbsp; ${d.comp}: ₹${cm.ppu||'—'}/100ml</div></div>
    <div class="mkt-strip">
      <div class="mi"><div class="lbl">Market/day</div><div class="val">${fI(d.mm)}</div>
        <div class="chg ${clr(pct(d.mm,d.ml))}">${fCh(pct(d.mm,d.ml))} vs LMTD</div></div>
      <div class="mi"><div class="lbl">Our share MTD</div><div class="val">${fP(om.share)}</div>
        <div class="chg ${clr(sc)}">${fPp(sc)} vs LMTD</div></div>
      <div class="mi"><div class="lbl">WoW signal</div>
        <div class="val" style="font-size:13px;color:${ws==='ACCEL'?'#16a34a':ws==='DECEL'?'#dc2626':'#6b7280'}">${ws||'—'}</div>
        <div class="chg neu">WoW ${fPp(wd)} vs MTD ${fPp(sc)}</div></div>
    </div>
    <div class="sec-lbl">Market Share (offtake %)</div>
    <div class="ov"><table class="t"><thead><tr>
      <th style="text-align:left;width:150px">Brand</th>
      <th>Share MTD</th><th>vs LMTD</th><th>WoW (offtake %)</th>
      <th>Off/day</th><th>Units/day</th>
    </tr></thead><tbody>
    <tr class="own"><td>${d.ob} <span class="ob">US</span></td>
      <td><b>${fP(om.share)}</b></td>
      <td><span class="${clr(sc)}" style="font-weight:bold">${fPp(sc)}</span></td>
      <td><span class="${clr(wd)}">${fPp(wd)}</span></td>
      <td>${fI(om.offtake)}</td><td>${fU(om.units)}</td></tr>
    <tr><td>${d.comp}</td>
      <td>${fP(cm.share)}</td>
      <td><span class="${clr(cm.share!=null&&cl.share!=null?cm.share-cl.share:null)}">${fPp(cm.share!=null&&cl.share!=null?cm.share-cl.share:null)}</span></td>
      <td>—</td>
      <td>${fI(cm.offtake)}</td><td>${fU(cm.units)}</td></tr>
    </tbody></table></div>
    ${top?`<div style="padding:8px 14px;border-bottom:1px solid #e5e7eb;font-size:11px">
      🏆 <b>Top SKU</b>: <a href="https://blinkit.com/prn/dp/prid/${top.pid}" target="_blank">${top.name}</a>
      — ${fU(top.avg)}/day
      <span class="${clr(top.vs_lmtd)}">${fCh(top.vs_lmtd)} vs LMTD</span>
      | WoW <span class="${clr(top.wow)}">${fCh(top.wow)}</span>
    </div>`:''}
    <div class="xc">📡 <b>Cross-channel</b>:
      Amz ${fU(d.am)} <span class="${clr(pct(d.am,d.al))}">${d.am&&d.al?fCh(pct(d.am,d.al)):''}</span> MTD
      &nbsp;·&nbsp; D2C ${fU(d.dm)} <span class="${clr(pct(d.dm,d.dl))}">${d.dm&&d.dl?fCh(pct(d.dm,d.dl)):''}</span> MTD
      ${sr.gen_m?`<br>🔍 <b>Search MTD vs LMTD</b>: Generic ${sr.gen_m?.toLocaleString()}/day <span class="${clr(sr.gen_chg)}">${sr.gen_chg!=null?fCh(sr.gen_chg,0):''}</span>
      ${sr.brd_m>0?`· Brand ${sr.brd_m?.toLocaleString()}/day <span class="${clr(sr.brd_chg)}">${sr.brd_chg!=null?fCh(sr.brd_chg,0):''}</span>`:''}`:''}</div>`;
  return h;
}

function renderSummary(){}
window.onload=init;
</script></body></html>
