<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GC Dashboard — 28 May '26</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:13px;color:#111827}
a{color:#1d4ed8;text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1000px;margin:0 auto;padding:16px}

/* ── Header ── */
.hdr{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);border-radius:10px;padding:14px 20px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hdr-title{font-size:17px;font-weight:700;color:#f8fafc;letter-spacing:-.01em}
.hdr-sub{font-size:11px;color:#94a3b8;margin-top:3px}

/* ── Date strip ── */
.date-strip{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.date-lbl{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.date-val{font-size:12px;font-weight:600;color:#334155;background:#f8fafc;padding:3px 10px;border-radius:5px;border:1px solid #e2e8f0}

/* ── Brand tabs — sticky ── */
.btab-wrap{position:sticky;top:0;z-index:100;background:#f0f2f5;padding:6px 0 4px;margin-bottom:4px}
.brand-tabs{display:flex;gap:6px;flex-wrap:wrap}
.btab{padding:7px 20px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;background:#fff;border:1.5px solid #e2e8f0;color:#475569;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btab:hover{border-color:#6366f1;color:#4f46e5;background:#f5f3ff}
.btab.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8;box-shadow:0 2px 6px rgba(29,78,216,.3)}

/* ── Performance pills (share change indicators) ── */
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.pill{font-size:11px;padding:3px 10px;border-radius:12px;white-space:nowrap;cursor:pointer;font-weight:500;border:1px solid transparent;transition:all .1s}
.pill:hover{opacity:.85;transform:translateY(-1px)}
.pg{background:#dcfce7;color:#15803d;border-color:#bbf7d0}
.pr{background:#fee2e2;color:#dc2626;border-color:#fecaca}
.pn{background:#f1f5f9;color:#64748b;border-color:#e2e8f0}

/* ── Category pills ── */
.cat-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cpill{padding:5px 13px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:600;background:#e2e8f0;color:#475569;transition:all .15s;white-space:nowrap;border:2px solid transparent}
.cpill:hover{background:#eff6ff;color:#3b82f6;border-color:#bfdbfe}
.cpill.active{background:#2563eb;color:#fff;border-color:#1d4ed8;box-shadow:0 2px 6px rgba(37,99,235,.3)}
.tbadge{font-size:9px;background:rgba(255,255,255,.2);border-radius:3px;padding:1px 4px;margin-left:3px;opacity:.8}
.cpill:not(.active) .tbadge{background:#fff;color:#6b7280;opacity:1}

/* ── Card ── */
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card-hdr{background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);border-bottom:1px solid #e2e8f0;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.cat-name{font-size:15px;font-weight:700;color:#0f172a}
.brand-tag{font-size:11px;color:#64748b;margin-left:8px;background:#f1f5f9;padding:2px 7px;border-radius:4px;border:1px solid #e2e8f0}
.ppu-line{font-size:11px;color:#64748b}
.ppu-ours{font-weight:700;color:#0f172a}

/* ── Section label ── */
.sec-lbl{font-size:10px;color:#334155;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:8px 16px 8px 13px;display:flex;align-items:center;gap:8px;background:#f1f5f9;border-top:2px solid #e2e8f0;border-bottom:1px solid #e2e8f0;border-left:3px solid #2563eb;margin-top:0}
.sec-lbl::after{content:'';flex:1;height:1px;background:#cbd5e1;margin-left:4px}

/* ── Market strip ── */
.mkt-strip{display:flex;gap:0;padding:0;background:#fff;border-bottom:1px solid #e2e8f0}
.mi{flex:1;padding:12px 16px;border-right:1px solid #f1f5f9;position:relative}
.mi:last-child{border-right:none}
.mi .lbl{font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:4px}
.mi .val{font-size:18px;font-weight:800;color:#0f172a;line-height:1.1}
.mi .chg{font-size:11px;margin-top:3px;font-weight:500}

/* ── Snapshot strip ── */
.snap-strip{display:flex;gap:0;padding:0;background:#f0f9ff;border-bottom:2px solid #bae6fd}
.snap-item{flex:1;padding:7px 12px;border-right:1px solid #bae6fd;font-size:11px}
.snap-item:last-child{border-right:none}
.snap-item .s-lbl{font-size:9px;color:#0ea5e9;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.snap-item .s-val{font-weight:700;color:#0f172a}
.snap-item .s-badges{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}

/* ── Tables ── */
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{padding:6px 10px;text-align:right;font-weight:600;color:#64748b;font-size:10px;background:#f8fafc;white-space:nowrap;border-bottom:2px solid #e2e8f0;letter-spacing:.03em}
table.t th:first-child{text-align:left}
table.t td{padding:6px 10px;text-align:right;border-top:1px solid #f1f5f9;vertical-align:middle}
table.t td:first-child{text-align:left}
table.t tr.own{background:#eff6ff}
table.t tr.own td:first-child{color:#1d4ed8;font-weight:700}
table.t tr.warn{background:#fff5f5}
table.t tr:hover{background:#f8fafc}
table.t tr.own:hover{background:#dbeafe}
.ob{font-size:10px;background:#dbeafe;color:#1d4ed8;padding:1px 5px;border-radius:3px;margin-left:4px;font-weight:600}

/* ── Attribution row ── */
.attr-row{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}
.acard{flex:1;min-width:230px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:12px}
.acard.pos-card{background:#f0fdf4;border-color:#bbf7d0}
.acard.neg-card{background:#fff5f5;border-color:#fecaca}
.acard.watch-card{background:#eff6ff;border-color:#bfdbfe}
.atitle{font-weight:700;margin-bottom:5px;font-size:12px;line-height:1.4}
.atitle.pos{color:#15803d}.atitle.neg{color:#dc2626}.atitle.neu{color:#475569}
.asub{font-size:11px;color:#64748b;line-height:1.6}
.metric-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mchip{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.mchip.up{background:#dcfce7;color:#15803d}
.mchip.dn{background:#fee2e2;color:#dc2626}
.mchip.warn{background:#fef3c7;color:#d97706}
.mchip.info{background:#dbeafe;color:#1d4ed8}
.mchip.neu{background:#f1f5f9;color:#475569}

/* ── Badges (keep for compatibility) ── */
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.badge{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:500}
.br{background:#fee2e2;color:#dc2626}.by{background:#fef3c7;color:#d97706}
.bg{background:#dcfce7;color:#15803d}.bb{background:#dbeafe;color:#1d4ed8}

/* ── Outperformers row ── */
.op-row{padding:8px 16px;border-bottom:1px solid #e2e8f0;background:#fffbeb;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.op-title{font-size:10px;font-weight:700;color:#b45309;text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.op-item{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:#fff;border:1px solid #fde68a;border-radius:5px;padding:2px 8px}

/* ── Cross-channel ── */
.xc{padding:10px 16px;border-bottom:1px solid #e2e8f0;font-size:11px;line-height:2;background:#fafafa}
.xc-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:2px}
.xc-item{display:flex;align-items:center;gap:5px;font-size:12px}
.xc-lbl{font-size:10px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.xc-val{font-weight:700;color:#0f172a}

/* ── Watch out ── */
.wo-gl{font-size:12px;font-weight:800;color:#fff;text-transform:uppercase;padding:11px 16px 11px 16px;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.wo-gl.aw{background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 100%);border-top:3px solid #1e3a8a}
.wo-gl.prem{background:linear-gradient(135deg,#92400e 0%,#d97706 100%);border-top:3px solid #92400e}
.wo-gl.mass{background:linear-gradient(135deg,#1e293b 0%,#475569 100%);border-top:3px solid #1e293b}
.wo-gl .wo-meta{font-size:10px;font-weight:400;opacity:.8;margin-left:auto;text-transform:none;letter-spacing:0}
.wo-tbl-aw{background:#eff6ff}.wo-tbl-prem{background:#fffbeb}.wo-tbl-mass{background:#f8fafc}
.wo-tbl-aw table.t tr:hover{background:#dbeafe}
.wo-tbl-prem table.t tr:hover{background:#fef3c7}
.wo-tbl-mass table.t tr:hover{background:#f1f5f9}
.ov{overflow-x:auto}
.summary{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-top:4px}

/* ── City ── */
.city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:10px 16px}
.city-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:7px;padding:8px 10px}
.city-card.green{border-left:3px solid #22c55e;background:#f0fdf4}
.city-card.red{border-left:3px solid #ef4444;background:#fff5f5}
.city-card.orange{border-left:3px solid #f59e0b;background:#fffbeb}
.city-card.blue{border-left:3px solid #3b82f6;background:#eff6ff}
.city-name{font-size:12px;font-weight:700;color:#0f172a;margin-bottom:4px}
.city-meta{font-size:10px;color:#64748b}
.city-flag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;margin-top:4px;display:inline-block}
.city-flag.green{background:#dcfce7;color:#15803d}
.city-flag.red{background:#fee2e2;color:#dc2626}
.city-flag.orange{background:#fef3c7;color:#d97706}
.city-flag.blue{background:#dbeafe;color:#1d4ed8}

/* ── Colors ── */
.pos{color:#15803d}.neg{color:#dc2626}.neu{color:#64748b}

/* ── Tooltip ── */
.tt-wrap{position:relative;display:inline}
.tt-card{display:none;position:fixed;z-index:9999;background:#1e293b;color:#f1f5f9;border-radius:8px;padding:10px 13px;font-size:11px;line-height:1.7;max-width:280px;box-shadow:0 4px 20px rgba(0,0,0,.3);pointer-events:none}
.tt-card strong{color:#93c5fd;font-size:12px;display:block;margin-bottom:3px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f1f5f9}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

@media(max-width:600px){
  .attr-row{flex-direction:column}
  .mkt-strip{flex-direction:column}
  .mi{border-right:none;border-bottom:1px solid #f1f5f9}
  table.t th,table.t td{padding:4px 6px;font-size:11px}
}
</style>
</head>

const fCh=(v,d=1)=>v==null?'—':(v>=0?'+':'')+v.toFixed(d)+'%';
const clr=v=>v==null?'neu':v>0?'pos':'neg';
const pct=(a,b)=>(b&&b!==0)?((a-b)/Math.abs(b)*100):null;

// Signal emoji helper
const sigEmoji=(v,bigThresh=0.5)=>{
  if(v==null)return'';
  if(v>=bigThresh)return'🟢';
  if(v<=-bigThresh)return'🔴';
  return'🟡';
};
const sigEmojiPct=(v,bigThresh=5)=>{
  if(v==null)return'';
  if(v>=bigThresh)return'🟢';
  if(v<=-bigThresh)return'🔴';
  return'🟡';
};

function init(){
  document.getElementById('dp-mtd').textContent=P.mtd;
  document.getElementById('dp-lmtd').textContent=P.lmtd;
  document.getElementById('dp-w2').textContent=P.w2;
  document.getElementById('dp-w1').textContent=P.w1;
  render();
}
function selectBrand(b){ST.brand=b;ST.cat=BCAT[b][0];render();}
function selectCat(k){ST.cat=k;renderCPills();renderContent();}
function render(){renderBTabs();renderPPills();renderCPills();renderContent();}

function renderBTabs(){
  document.getElementById('btabs').innerHTML=BORDER.map(b=>
    `<div class="btab${b===ST.brand?' active':''}" onclick="selectBrand('${b}')">${b}</div>`).join('');
}
function renderPPills(){
  document.getElementById('ppills').innerHTML=(BCAT[ST.brand]||[]).map(k=>{
    const d=DATA[k];if(!d)return'';
    const chg=(d.om&&d.ol)?d.om.share-d.ol.share:null;
    const cls=chg==null?'pn':chg>0?'pg':'pr';
    const lbl=(d.sub_cat||d.cat).replace('Underarm ','').replace(' Supplements','').replace('Exfoliator & Scrub','Scrub').replace(' Drink Mixes','').replace('Chocolate ','Choc ').replace('Kids 2-6Y','Kids 2-6').replace('Kids 7+ Yr','Kids 7+');
    const em=sigEmoji(chg,0.3);
    return `<span class="pill ${cls}" onclick="selectCat('${k}')">${em} ${lbl} ${chg!=null?(chg>=0?'+':'')+chg.toFixed(1)+'pp':''}</span>`;
  }).join('');
}
function renderCPills(){
  document.getElementById('cpills').innerHTML=(BCAT[ST.brand]||[]).map(k=>{
    const d=DATA[k];if(!d)return'';
    const tier=d.tier||1;
    return `<div class="cpill${k===ST.cat?' active':''}" onclick="selectCat('${k}')">
      ${(d.sub_cat||d.cat).replace('Underarm Roll On','Roll On').replace(' Supplements','').replace(' Drink Mixes','').replace('Kids 2-6Y','Kids 2-6').replace('Kids 7+ Yr','Kids 7+')}
      <span class="tbadge">T${tier}</span></div>`;
  }).join('');
}
function renderContent(){
  const d=DATA[ST.cat];if(!d){document.getElementById('content').innerHTML='';return;}
  document.getElementById('content').innerHTML=d.tier===2?t2(d):t1(d);
  window.scrollTo(0,0);
}

// ── TIER 1 (full depth) ───────────────────────────────────────────────────
function t1(d){
  const om=d.om||{},ol=d.ol||{},ow2=d.ow2||{},ow1=d.ow1||{};
  const cm=d.cm||{},cl=d.cl||{},cw2=d.cw2||{},cw1=d.cw1||{};
  const sd=d.sd||{},at=d.at||{},psc=d.psc,cd=d.cd||null;
  let h='';

  // ── Card header ─────────────────────────────────────────────────────
  h+=`<div class="card" data-key="${ST.cat}"><div class="card-hdr">
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px">
      <span class="cat-name">${d.cat}</span>
      <span class="brand-tag">${d.ob}</span>
      <span style="color:#94a3b8;font-size:9px">[${ST.cat}]</span>
      ${psc?`<span style="color:#64748b;font-size:10px">· within <b>${psc}</b></span>`:''}
    </div>
    <div class="ppu-line">
      Our PPU: <span class="ppu-ours">₹${om.ppu||'—'}/100ml</span>
      &nbsp;·&nbsp; ${d.comp}: <span style="color:#64748b;font-weight:600">₹${cm.ppu||'—'}/100ml</span>
    </div></div>`;

  // ── Market size strip ─────────────────────────────────────────────────
  const schg_mkt=pct(d.mm,d.ml);
  const osm_hdr=(psc&&sd[psc])?sd[psc].our_sh_mtd:om.share;
  const osl_hdr=(psc&&sd[psc])?sd[psc].our_sh_lmtd:ol.share;
  const sc_hdr=osm_hdr!=null&&osl_hdr!=null?osm_hdr-osl_hdr:null;
  const wow_sc=ow2.share!=null&&ow1.share!=null?ow2.share-ow1.share:null;
  h+=`<div class="mkt-strip">
    <div class="mi">
      <div class="lbl">Market size / day</div>
      <div class="val">${fI(d.mm)}</div>
      <div class="chg ${clr(schg_mkt)}">${fCh(schg_mkt)} vs LMTD</div>
    </div>
    <div class="mi">
      <div class="lbl">Our share MTD</div>
      <div class="val">${fP(osm_hdr)} <span style="font-size:13px;font-weight:500;margin-left:3px">${sigEmoji(sc_hdr,0.3)}</span></div>
      <div class="chg ${clr(sc_hdr)}">${fPp(sc_hdr)} vs LMTD</div>
    </div>
    <div class="mi">
      <div class="lbl">WoW signal</div>
      <div class="val" style="font-size:16px"><span class="${clr(wow_sc)}">${fPp(wow_sc)}</span></div>
      <div class="chg neu">W2 ${P.w2||''}</div>
    </div>
    <div class="mi">
      <div class="lbl">${d.comp} share</div>
      <div class="val" style="font-size:16px;color:#64748b">${fP(d.css_m??cm.share)}</div>
      <div class="chg ${clr((d.css_m??cm.share)!=null&&(d.css_l??cl.share)!=null?(d.css_m??cm.share)-(d.css_l??cl.share):null)}">${fPp((d.css_m??cm.share)!=null&&(d.css_l??cl.share)!=null?(d.css_m??cm.share)-(d.css_l??cl.share):null)} vs LMTD</div>
    </div>
  </div>`;

  // ── Sub-cat breakdown (if available) ──────────────────────────────────
  if(psc&&sd[psc]){
    h+=`<div class="sec-lbl">Sub-category breakdown</div><div class="ov"><table class="t">
      <thead><tr>
        <th style="text-align:left">Sub-cat</th>
        <th>Mkt size/day</th><th>vs LMTD</th><th>WoW</th>
        <th>Our share</th><th>${d.comp} share</th>
      </tr></thead><tbody>`;
    Object.entries(sd).filter(([k])=>k!=='7+ & 2+').forEach(([sc,s])=>{
      if(!s.sz_mtd)return;
      const ip=sc===psc;
      const shChg=s.our_sh_mtd!=null&&s.our_sh_lmtd!=null?s.our_sh_mtd-s.our_sh_lmtd:null;
      h+=`<tr ${ip?'style="background:#f0fdf4"':''}>
        <td style="padding-left:16px;color:${ip?'#16a34a':'#64748b'}">└ ${sc}</td>
        <td>${fI(s.sz_mtd)}</td>
        <td><span class="${clr(s.sz_chg)}">${fCh(s.sz_chg)}</span></td>
        <td><span class="${clr(s.sz_wow)}">${fCh(s.sz_wow??null)}</span></td>
        <td style="text-align:right">${s.our_sh_mtd?.toFixed(1)||'—'}%
          <span class="${clr(shChg)}" style="font-size:10px"> ${fPp(shChg)}</span></td>
        <td style="text-align:right;color:#64748b">${d.css_m?.toFixed(1)||'—'}%
          <span class="${clr(d.css_m-(d.css_l||0))}" style="font-size:10px"> ${fPp(d.css_m!=null&&d.css_l!=null?d.css_m-d.css_l:null)}</span></td>
      </tr>`;
    });
    h+=`</tbody></table></div>`;
  }

  // ── Share table ───────────────────────────────────────────────────────
  const osm=(psc&&sd[psc])?sd[psc].our_sh_mtd:om.share;
  const osl=(psc&&sd[psc])?sd[psc].our_sh_lmtd:ol.share;
  const csm=d.css_m??cm.share, csl=d.css_l??cl.share;
  const owow=ow2.share!=null&&ow1.share!=null?ow2.share-ow1.share:null;
  const cwow=cw2.share!=null&&cw1.share!=null?cw2.share-cw1.share:null;
  h+=`<div class="sec-lbl">Market Share — MTD vs LMTD</div>
    <div class="ov"><table class="t"><thead><tr>
      <th style="text-align:left;width:150px">Brand</th>
      <th>Share MTD</th><th>vs LMTD</th><th>WoW</th>
      <th>Avg off/day</th><th>Avg units/day</th><th>OSA%</th><th>Disc%</th>
    </tr></thead><tbody>
    <tr class="own">
      <td>${d.ob} <span class="ob">US</span></td>
      <td><b>${fP(osm)}</b></td>
      <td><span class="${clr(osm!=null&&osl!=null?osm-osl:null)}" style="font-weight:700">${fPp(osm!=null&&osl!=null?osm-osl:null)}</span></td>
      <td><span class="${clr(owow)}">${fPp(owow)}</span></td>
      <td>${fI(om.offtake)}</td><td>${fU(om.units)}</td>
      <td>${fP(om.osa,0)}</td><td>${om.discount?.toFixed(1)||'—'}%</td>
    </tr>
    <tr>
      <td>${d.comp}</td>
      <td>${fP(csm)}</td>
      <td><span class="${clr(csm!=null&&csl!=null?csm-csl:null)}">${fPp(csm!=null&&csl!=null?csm-csl:null)}</span></td>
      <td><span class="${clr(cwow)}">${fPp(cwow)}</span></td>
      <td>${fI(cm.offtake)}</td><td>${fU(cm.units)}</td>
      <td>${fP(cm.osa,0)}</td><td>${cm.discount?.toFixed(1)||'—'}%</td>
    </tr>
    </tbody></table></div>`;

  // ── Attribution + Signal badges ───────────────────────────────────────
  const schg=osm!=null&&osl!=null?osm-osl:null;
  const donors=at.donors||[], gainers=at.gainers||[];
  const td=donors[0], tg=gainers[0];
  const _oad=(om.ad_sov||0)-(ol.ad_sov||0);
  const _oor=(om.org_sov||0)-(ol.org_sov||0);
  const _osa_d=(om.osa||0)-(ol.osa||0);
  const _disc_d=(om.discount||0)-(ol.discount||0);

  function _whyGained(){
    if(_oad>1.5)  return ` — Ad SOV-driven (${fPp(_oad)})`;
    if(_oor>1.5)  return ` — Org SOV-driven (${fPp(_oor)})`;
    if(_osa_d>1.5)return ` — availability-driven (OSA ${fPp(_osa_d)})`;
    if(_disc_d>0.5)return ` — discount-driven (${fPp(_disc_d)} deeper)`;
    return ` — driver unclear`;
  }
  function _whyLost(){
    const tgBrand=tg?tg[0]:null;
    if(cd&&cd.metric&&tgBrand&&tgBrand===d.comp&&Math.abs(cd.delta||0)>1){
      const u=cd.metric==='OSA'||cd.metric.includes('SOV')?'%':'';
      const dir=cd.delta>0?'surged':'dropped';
      return ` — their ${cd.metric} ${dir} (${cd.lmtd}${u}→${cd.mtd}${u})`;
    }
    if(_oad<-1.5) return ` — our Ad SOV down ${fPp(_oad)}`;
    if(_oor<-1.5) return ` — our Org SOV down ${fPp(_oor)}`;
    if(_osa_d<-1.5)return ` — our OSA slipped ${fPp(_osa_d)}`;
    if(_disc_d<-0.5)return ` — our discount eased ${fPp(_disc_d)}`;
    return ` — driver unclear`;
  }

  let atxt='',acls='';
  if(schg!=null&&schg>0&&td){atxt=`Gained from <b>${td[0]}</b> (${fPp(-td[1])} to us)${_whyGained()}`;acls='pos';}
  else if(schg!=null&&schg<=0&&tg){atxt=`Lost to <b>${tg[0]}</b> (+${fPp(tg[1])} to them)${_whyLost()}`;acls='neg';}
  else if(schg!=null&&schg>0){atxt=`Share gained — diffuse${_whyGained()}`;acls='pos';}
  else{atxt=`No dominant share movement`;acls='neu';}

  // Our metric chips
  const oad=_oad, oor=_oor, osa_d=_osa_d, disc_d=_disc_d;
  let ourChips='';
  ourChips+=`<span class="mchip ${Math.abs(oad)>1.5?(oad>0?'up':'dn'):'neu'}">Ad SOV ${om.ad_sov?.toFixed(1)||'—'}% ${Math.abs(oad)>0.5?'('+fPp(oad)+')':''}</span>`;
  ourChips+=`<span class="mchip ${Math.abs(oor)>1.5?(oor>0?'up':'dn'):'neu'}">Org SOV ${om.org_sov?.toFixed(1)||'—'}% ${Math.abs(oor)>0.5?'('+fPp(oor)+')':''}</span>`;
  ourChips+=`<span class="mchip ${Math.abs(osa_d)>1.5?(osa_d>0?'up':'warn'):'neu'}">OSA ${om.osa?.toFixed(0)||'—'}% ${Math.abs(osa_d)>0.5?'('+fPp(osa_d)+')':''}</span>`;
  ourChips+=`<span class="mchip ${Math.abs(disc_d)>0.5?(disc_d>0?'warn':'info'):'neu'}">Disc ${om.discount?.toFixed(1)||'—'}% ${Math.abs(disc_d)>0.5?'('+fPp(disc_d)+')':''}</span>`;

  // Comp chips
  const csc_attr=csm!=null&&csl!=null?csm-csl:null;
  const cod=(cm.osa||0)-(cl.osa||0);
  const cad=(cm.ad_sov||0)-(cl.ad_sov||0);
  let compChips='';
  if(csc_attr!=null)compChips+=`<span class="mchip ${Math.abs(csc_attr)>0.5?(csc_attr>0?'dn':'up'):'neu'}">Share ${fPp(csc_attr)} MTD</span>`;
  compChips+=`<span class="mchip ${Math.abs(cad)>1.5?(cad>0?'dn':'up'):'neu'}">Ad SOV ${cm.ad_sov?.toFixed(1)||'—'}% ${Math.abs(cad)>0.5?'('+fPp(cad)+')':''}</span>`;
  compChips+=`<span class="mchip ${Math.abs(cod)>2?(cod>0?'dn':'up'):'neu'}">OSA ${cm.osa?.toFixed(0)||'—'}% ${Math.abs(cod)>0.5?'('+fPp(cod)+')':''}</span>`;
  compChips+=`<span class="mchip neu">Off/day ${fI(cm.offtake)} · ${fU(cm.units)} units</span>`;

  const compMoved=compChips.includes('class="mchip dn"')||compChips.includes('class="mchip up"');
  const noDriver=!ourChips.includes('class="mchip up"')&&!ourChips.includes('class="mchip dn"')&&!compMoved&&schg!=null&&Math.abs(schg)<0.5;
  const atScope=at.scope?`<span style="font-size:10px;color:#64748b;font-weight:normal;margin-left:6px">(scoped to ${at.scope})</span>`:'';

  const ourShareChip=schg!=null?`<span class="mchip ${Math.abs(schg)>0.3?(schg>0?'up':'dn'):'neu'}">Share ${fPp(schg)} MTD</span>`:'';
  const ourOffChip=om.offtake?`<span class="mchip neu">Off/day ${fI(om.offtake)} · ${fU(om.units)} units</span>`:'';
  h+=`<div class="attr-row">
    <div class="acard ${acls==='pos'?'pos-card':acls==='neg'?'neg-card':''}">
      <div class="atitle ${acls}">${sigEmoji(schg,0.3)} Our Position${atScope}</div>
      <div class="asub">${atxt}</div>
      ${noDriver?'<div class="asub" style="margin-top:4px;color:#d97706">⚠️ No clear driver — share within noise range</div>':''}
      <div class="metric-chips" style="margin-top:8px">${ourShareChip}${ourChips}${ourOffChip}</div>
    </div>
    <div class="acard watch-card">
      <div class="atitle" style="color:#1d4ed8">👁 ${d.comp} — always watch</div>
      <div class="asub">Disc ${cm.discount?.toFixed(1)||'—'}%</div>
      <div class="metric-chips" style="margin-top:8px">${compChips}</div>
    </div>
  </div>`;

  // ── Snapshot strip ────────────────────────────────────────────────────
  const worst_ci=d.ci&&d.ci.length?d.ci.reduce((a,b)=>((a.our_mtd_chg||0)<(b.our_mtd_chg||0)?a:b)):null;
  const snap_mc=pct(d.mm,d.ml);
  h+=`<div class="snap-strip">
    <div class="snap-item">
      <div class="s-lbl">Market trend</div>
      <div class="s-val"><span class="${clr(snap_mc)}">${fCh(snap_mc)}</span> LMTD</div>
    </div>
    <div class="snap-item">
      <div class="s-lbl">Ad SOV</div>
      <div class="s-val">${Math.abs(oad)>1.5?sigEmoji(oad,0):''}  ${om.ad_sov?.toFixed(1)||'—'}% <span style="font-size:10px;color:#64748b">${Math.abs(oad)>0.5?'('+fPp(oad)+')':''}</span></div>
    </div>
    <div class="snap-item">
      <div class="s-lbl">OSA</div>
      <div class="s-val">${Math.abs(osa_d)>1.5?sigEmoji(osa_d,0):''}  ${om.osa?.toFixed(0)||'—'}% <span style="font-size:10px;color:#64748b">${Math.abs(osa_d)>0.5?'('+fPp(osa_d)+')':''}</span></div>
    </div>
    ${worst_ci?`<div class="snap-item">
      <div class="s-lbl">City watch</div>
      <div class="s-val">⚠️ <b>${worst_ci.city}</b> <span class="neg">${fPp(worst_ci.our_mtd_chg)}</span></div>
    </div>`:''}
  </div>`;

  // ── Brands outperforming us this MTD ─────────────────────────────────
  const ops=at.outperformers||[];
  if(ops.length){
    h+=`<div class="op-row">
      <div class="op-title">⚡ Outperforming us MTD (our gain: ${fPp(at.our_gain)})</div>`;
    ops.forEach(op=>{
      const drv=op.driver;
      let reason='unclear';
      if(drv&&drv.metric){const u=drv.metric.includes('SOV')||drv.metric==='OSA'?'%':'';reason=drv.metric+' '+(drv.delta>0?'▲':'▼')+' '+drv.lmtd+u+'→'+drv.mtd+u;}
      h+=`<span class="op-item"><b>${op.brand}</b> <span class="pos">+${op.gain.toFixed(2)}pp</span> <span style="color:#94a3b8;font-size:10px">via ${reason}</span></span>`;
    });
    h+=`</div>`;
  }

  // ── Cross-channel ────────────────────────────────────────────────────
  const sr=d.sr||{};
  const amChg=pct(d.am,d.al),dmChg=pct(d.dm,d.dl);
  h+=`<div class="xc">
    <div class="xc-row">
      <span style="font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em">📡 Cross-channel DRR</span>
      <span class="xc-item"><span class="xc-lbl">Amazon</span> <span class="xc-val">${fU(d.am)}</span> <span class="${clr(amChg)}">${amChg!=null?fCh(amChg):''}</span></span>
      <span class="xc-item"><span class="xc-lbl">D2C</span> <span class="xc-val">${fU(d.dm)}</span> <span class="${clr(dmChg)}">${dmChg!=null?fCh(dmChg):''}</span></span>
    </div>`;
  if(sr.gen_m){
    h+=`<div class="xc-row" style="margin-top:6px">
      <span style="font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em">🔍 Search MTD vs LMTD</span>
      <span class="xc-item"><span class="xc-lbl">Generic</span> <span class="xc-val">${sr.gen_m?.toLocaleString()||'—'}/day</span> <span class="${clr(sr.gen_chg)}">${sr.gen_chg!=null?fCh(sr.gen_chg,0):''}</span></span>
      <span class="xc-item"><span class="xc-lbl">Brand</span> <span class="xc-val">${sr.brd_m?.toLocaleString()||'—'}/day</span> <span class="${clr(sr.brd_chg)}">${sr.brd_chg!=null?fCh(sr.brd_chg,0):''}</span></span>
      <span class="xc-item"><span class="xc-lbl">${sr.comp||d.comp}</span> <span class="xc-val">${sr.cmp_m?.toLocaleString()||'—'}/day</span> <span class="${clr(sr.cmp_chg)}">${sr.cmp_chg!=null?fCh(sr.cmp_chg,0):''}</span></span>
    </div>`;
  }
  h+=`</div>`;

  // ── Top SKUs ──────────────────────────────────────────────────────────
  const ot=d.ot||[];
  if(ot.length){
    const ourRef=ot.find(s=>s.is_own)||null;
    const refMTD=ourRef?.vs_lmtd??null;
    const refWoW=ourRef?.wow??null;
    h+=`<div class="sec-lbl">Top SKUs — ${d.cat} · top 2 own + competitors &nbsp;<span style="font-size:9px;background:#fee2e2;color:#dc2626;padding:1px 6px;border-radius:3px">🔴 beats our top seller</span></div>
      <div class="ov"><table class="t"><thead><tr>
        <th style="text-align:left;width:30%">SKU</th>
        <th style="text-align:left;width:10%">Brand</th>
        <th>PPU/100ml</th><th>Mkt Sh%</th><th>Avg/day</th><th>Peak/day</th><th>WoW</th><th>vs LMTD</th>
      </tr></thead><tbody>`;
    ot.forEach(s=>{
      const io=s.is_own;
      const beatsMTD=!io&&s.vs_lmtd!=null&&refMTD!=null&&s.vs_lmtd>refMTD;
      const beatsWoW=!io&&s.wow!=null&&refWoW!=null&&s.wow>refWoW;
      const warn=beatsMTD||beatsWoW;
      const tip=`${(s.name||'')}\nBrand: ${s.brand}\nPPU: Rs${s.ppu||'?'}/100ml  SP: Rs${s.avg_sp||'?'}\nAvg/day: ${fU(s.avg)}  Peak: ${fU(s.peak)}\nWoW: ${fCh(s.wow??null)}  vs LMTD: ${fCh(s.vs_lmtd??null)}`;
      const warnTag=warn?`<span style="font-size:9px;background:#fee2e2;color:#dc2626;padding:1px 5px;border-radius:3px;margin-left:4px">🔴 beats us</span>`:'';
      h+=`<tr class="${io?'own':warn?'warn':''}">
        <td><a href="https://blinkit.com/prn/dp/prid/${s.pid}" target="_blank" title="${tip}" style="font-size:11px">${(s.name||'').substring(0,50)}</a>${warnTag}</td>
        <td style="font-size:11px;${io?'color:#1d4ed8;font-weight:700':'color:#64748b'}">${s.brand}${io?` <span style="font-size:9px;background:#dbeafe;color:#1d4ed8;padding:1px 4px;border-radius:3px">★ us</span>`:''}</td>
        <td>₹${s.ppu||'—'}</td>
        <td>${s.mkt_sh!=null&&s.mkt_sh>0?'<b>'+s.mkt_sh.toFixed(1)+'%</b>':'—'}</td>
        <td><b>${fU(s.avg)}</b></td><td>${fU(s.peak)}</td>
        <td><span class="${beatsWoW&&!io?'neg':clr(s.wow)}">${fCh(s.wow??null)}</span></td>
        <td><span class="${beatsMTD&&!io?'neg':clr(s.vs_lmtd)}">${fCh(s.vs_lmtd??null)}</span></td>
      </tr>`;
    });
    h+=`</tbody></table></div>`;

  // ── Cross-Channel DRR (own SKUs only) ─────────────────────────────────
  const ownSkus=(d.all_own||ot.filter(s=>s.is_own)).filter(s=>s.blinkit_drr||s.amz_drr||s.amz_now||s.webapp_drr);
  if(ownSkus.length){
    h+=`<div class="sec-lbl" style="margin-top:8px;background:linear-gradient(90deg,#eff6ff,#f8fafc)">📡 Cross-Channel DRR — ${d.cat} · own SKUs vs LMTD <span style="font-size:9px;color:#64748b;font-weight:normal">(Tableau-sourced daily run rate)</span></div>
      <div class="ov"><table class="t"><thead><tr>
        <th style="text-align:left;width:40%">SKU</th>
        <th>Blinkit</th><th>BL Δ</th>
        <th>Amazon</th><th>AZ Δ</th>
        <th>AZ Now</th><th>AZ Now Δ</th>
        <th>WebApp</th><th>Web Δ</th>
      </tr></thead><tbody>`;
    ownSkus.forEach(s=>{
      h+=`<tr class="own">
        <td style="font-size:11px;color:#1d4ed8;font-weight:600">${(s.name||'').substring(0,60)}</td>
        <td>${s.blinkit_drr?'<b>'+fU(s.blinkit_drr)+'</b>':'—'}</td>
        <td>${s.blinkit_drr&&s.blinkit_l?'<span class="'+clr(pct(s.blinkit_drr,s.blinkit_l))+'">'+fCh(pct(s.blinkit_drr,s.blinkit_l))+'</span>':'—'}</td>
        <td>${s.amz_drr?'<b>'+fU(s.amz_drr)+'</b>':'—'}</td>
        <td>${s.amz_drr&&s.amz_drr_l?'<span class="'+clr(pct(s.amz_drr,s.amz_drr_l))+'">'+fCh(pct(s.amz_drr,s.amz_drr_l))+'</span>':'—'}</td>
        <td>${s.amz_now?'<b>'+fU(s.amz_now)+'</b>':'—'}</td>
        <td>${s.amz_now&&s.amz_now_l?'<span class="'+clr(pct(s.amz_now,s.amz_now_l))+'">'+fCh(pct(s.amz_now,s.amz_now_l))+'</span>':'—'}</td>
        <td>${s.webapp_drr?'<b>'+fU(s.webapp_drr)+'</b>':'—'}</td>
        <td>${s.webapp_drr&&s.webapp_l?'<span class="'+clr(pct(s.webapp_drr,s.webapp_l))+'">'+fCh(pct(s.webapp_drr,s.webapp_l))+'</span>':'—'}</td>
      </tr>`;
    });
    // Totals row
    const tBL=ownSkus.reduce((a,s)=>a+(s.blinkit_drr||0),0);
    const tBLl=ownSkus.reduce((a,s)=>a+(s.blinkit_l||0),0);
    const tAZ=ownSkus.reduce((a,s)=>a+(s.amz_drr||0),0);
    const tAZl=ownSkus.reduce((a,s)=>a+(s.amz_drr_l||0),0);
    const tAN=ownSkus.reduce((a,s)=>a+(s.amz_now||0),0);
    const tANl=ownSkus.reduce((a,s)=>a+(s.amz_now_l||0),0);
    const tWA=ownSkus.reduce((a,s)=>a+(s.webapp_drr||0),0);
    const tWAl=ownSkus.reduce((a,s)=>a+(s.webapp_l||0),0);
    h+=`<tr style="background:#f1f5f9;font-weight:700;border-top:2px solid #cbd5e1">
      <td style="font-size:11px;color:#334155">TOTAL</td>
      <td><b>${fU(tBL)||'—'}</b></td>
      <td>${tBL&&tBLl?'<span class="'+clr(pct(tBL,tBLl))+'">'+fCh(pct(tBL,tBLl))+'</span>':'—'}</td>
      <td><b>${fU(tAZ)||'—'}</b></td>
      <td>${tAZ&&tAZl?'<span class="'+clr(pct(tAZ,tAZl))+'">'+fCh(pct(tAZ,tAZl))+'</span>':'—'}</td>
      <td><b>${fU(tAN)||'—'}</b></td>
      <td>${tAN&&tANl?'<span class="'+clr(pct(tAN,tANl))+'">'+fCh(pct(tAN,tANl))+'</span>':'—'}</td>
      <td><b>${fU(tWA)||'—'}</b></td>
      <td>${tWA&&tWAl?'<span class="'+clr(pct(tWA,tWAl))+'">'+fCh(pct(tWA,tWAl))+'</span>':'—'}</td>
    </tr>`;
    h+=`</tbody></table></div>`;
  }
  }

  // ── Top Brands ──────────────────────────────────────────────────────────
  const tb=(d.tb||[]);
  if(tb.length){
    h+=`<div class="sec-lbl">Top Brands — ${d.cat} · ranked by Offtake/day MTD</div>
      <div class="ov"><table class="t"><thead><tr>
        <th style="text-align:left;width:22%">Brand</th>
        <th>Share MTD</th><th>vs LMTD</th>
        <th>Off/day</th><th>vs LMTD</th>
        <th>Units/day</th><th>Units Δ</th>
        <th>OSA%</th><th>OSA Δ</th>
        <th>Ad SOV</th><th>Ad SOV Δ</th>
        <th>PPU/100ml</th>
      </tr></thead><tbody>`;
    tb.forEach(b=>{
      const sc=b.share_mtd!=null&&b.share_lmtd!=null?b.share_mtd-b.share_lmtd:null;
      const oc=pct(b.off_mtd,b.off_lmtd);
      h+=`<tr class="${b.is_own?'own':''}">
        <td style="${b.is_own?'color:#1d4ed8;font-weight:700':''}">
          ${b.brand}${b.is_own?' <span class="ob">US</span>':''}
        </td>
        <td><b>${fP(b.share_mtd)}</b></td>
        <td><span class="${clr(sc)}">${fPp(sc)}</span></td>
        <td>${fI(b.off_mtd)}</td>
        <td><span class="${clr(oc)}">${fCh(oc)}</span></td>
        <td>${fU(b.units_mtd)}</td>
        <td><span class="${clr(pct(b.units_mtd,b.units_lmtd))}" style="font-size:10px">${b.units_lmtd?fCh(pct(b.units_mtd,b.units_lmtd)):'—'}</span></td>
        <td>${fP(b.osa,0)}</td>
        <td><span class="${clr(b.osa!=null&&b.osa_lmtd!=null?b.osa-b.osa_lmtd:null)}" style="font-size:10px">${b.osa_lmtd?fPp(b.osa-b.osa_lmtd):'—'}</span></td>
        <td>${b.ad_sov_mtd!=null?b.ad_sov_mtd.toFixed(1)+'%':'—'}</td>
        <td><span class="${clr(b.ad_sov_mtd!=null&&b.ad_sov_lmtd!=null?b.ad_sov_mtd-b.ad_sov_lmtd:null)}" style="font-size:10px">${b.ad_sov_lmtd!=null?fPp(b.ad_sov_mtd-b.ad_sov_lmtd):'—'}</span></td>
        <td>₹${b.ppu||'—'}</td>
      </tr>`;
    });
    h+=`</tbody></table></div>`;
  }

  // ── Watch Out ───────────────────────────────────────────────────────────
  const wl=(d.wl||[]);
  const awItems=wl.filter(w=>w.always_watch);
  const challPrem=wl.filter(w=>!w.always_watch&&!w.mass).sort((a,b)=>a.dist-b.dist);
  const challMass=wl.filter(w=>!w.always_watch&&w.mass).sort((a,b)=>a.dist-b.dist);
  const woTbl=(items,lbl,type='mass')=>{
    if(!items.length)return'';
    const isAw=type==='aw';
    const icon=isAw?'👁':type==='prem'?'⚡':'🔻';
    const meta=isAw?`${items.length} SKU tracked`:
                type==='prem'?`${items.length} premium challengers`:
                `${items.length} mass brands`;
    return`<div class="wo-gl ${type}">${icon} ${lbl}<span class="wo-meta">${meta}</span></div>
      <div class="ov wo-tbl-${type}"><table class="t"><thead><tr>
        <th style="text-align:left;width:36%">SKU</th>
        <th style="text-align:left;width:11%">Brand</th>
        <th>PPU/100ml</th><th>Avg SP</th><th>DRR/day</th><th>Peak/day</th>
        <th>MTD vs LMTD</th>
      </tr></thead><tbody>
      ${items.map(w=>`<tr>
        <td><a href="https://blinkit.com/prn/dp/prid/${w.pid}" target="_blank" style="font-size:11px;font-weight:${isAw?'600':'400'}">${(w.name||'').substring(0,48)}</a></td>
        <td style="font-size:11px;color:${isAw?'#1d4ed8':type==='prem'?'#92400e':'#64748b'};font-weight:600">${w.brand}${isAw?`<span style="font-size:9px;background:#dbeafe;color:#1d4ed8;padding:1px 4px;border-radius:3px;margin-left:4px">👁</span>`:''}</td>
        <td>₹${w.ppu||'—'}</td>
        <td>₹${w.avg_sp||'—'}</td>
        <td><b>${fU(w.u_m)}</b></td><td>${fU(w.peak)||'—'}</td>
        <td><span class="${clr(w.gr)}" style="font-weight:700">${fCh(w.gr??null)}</span></td>
      </tr>`).join('')}
      </tbody></table></div>`;
  };
  if(wl.length){
    h+=`<div class="sec-lbl">Watch Out — 👁 <b>${d.comp}</b> always tracked · Others: DRR ≥ 30 &amp; growing faster · Our PPU ₹${om.ppu||'—'}/100ml</div>`;
    if(awItems.length)h+=woTbl(awItems,`${d.comp} — Always Watch`,'aw');
    if(challPrem.length)h+=woTbl(challPrem,'Premium Challengers — Growing Faster Than Us','prem');
    if(challMass.length)h+=woTbl(challMass,'Mass Brands — Growing Faster Than Us','mass');
  }

  // ── City anomalies ──────────────────────────────────────────────────────
  const ci=(d.ci||[]).slice(0,8);
  if(ci.length){
    const FLAG_TXT={green:'🔺 We are gaining',red:'🔻 We are losing',orange:'⚠️ Comp gaining',blue:'✅ Comp retreating'};
    h+=`<div class="sec-lbl">City Signals — share pp change MTD vs LMTD</div>
    <div class="city-grid">`;
    ci.forEach(c=>{
      h+=`<div class="city-card ${c.flag||''}">
        <div class="city-name">${c.city}</div>
        <div class="city-meta">
          Our share: <b><span class="${clr(c.our_mtd_chg)}">${fPp(c.our_mtd_chg)}</span></b>
          <span style="color:#94a3b8">(${c.our_share_mtd?.toFixed(1)||'—'}%)</span>
          ${c.mkt_pct?`<span style="font-size:9px;background:#f1f5f9;color:#64748b;padding:1px 5px;border-radius:3px;margin-left:4px">${c.mkt_pct}% of mkt</span>`:''}<br>
          ${d.comp}: <span class="${clr(c.comp_shift)}">${fPp(c.comp_shift)}</span>
        </div>
        <span class="city-flag ${c.flag||''}">${FLAG_TXT[c.flag]||c.flag||'—'}</span>
      </div>`;
    });
    h+=`</div>`;
  }

  h+=`</div>`;return h;
}

// ── TIER 2 (medium) ──────────────────────────────────────────────────────

      <span class="${clr(top.vs_lmtd)}">${fCh(top.vs_lmtd)} vs LMTD</span>

        <span class="xc-item"><span class="xc-lbl">D2C</span> <span class="xc-val">${fU(d.dm)}</span> <span class="${clr(pct(d.dm,d.dl))}">${d.dm&&d.dl?fCh(pct(d.dm,d.dl)):''}</span></span>

// ── Search ────────────────────────────────────────────────────────────────
const SKU_INDEX=(()=>{
  const idx=[];
  const seen=new Set();
  Object.values(DATA).forEach(d=>{
    // Full per-category SKU index (own + competitors, all SKUs)
    (d.sku_idx||[]).forEach(s=>{
      const k=String(s.pid)+'|'+d.cat;
      if(seen.has(k))return;
      seen.add(k);
      idx.push({pid:String(s.pid),name:(s.name||'').toLowerCase(),brand:(s.brand||'').toLowerCase(),
                display:s.name,dispBrand:s.brand,cat:d.cat,ob:d.ob,
                avg:s.avg,ppu:s.ppu,mkt_sh:s.mkt_sh,vs_lmtd:s.vs_lmtd??null,wow:s.wow??null,is_own:s.is_own});
    });
  });
  return idx;
})();

function handleSearch(q){
  const box=document.getElementById('search-results');
  q=q.trim().toLowerCase();
  if(!q){box.style.display='none';return;}
  // Scope to active category; fall back to global if no results in cat
  const activeCat=ST&&ST.cat&&DATA[ST.cat]?DATA[ST.cat].cat:null;
  const matchFn=s=>s.name.includes(q)||s.pid===q||s.brand.includes(q);
  let hits=activeCat?SKU_INDEX.filter(s=>s.cat===activeCat&&matchFn(s)).slice(0,12):[];
  let scopeNote='';
  if(activeCat&&hits.length===0){
    hits=SKU_INDEX.filter(matchFn).slice(0,12);
    scopeNote=hits.length?`<div style="padding:4px 12px;font-size:10px;color:#64748b;background:#f8fafc;border-bottom:1px solid #e2e8f0">No results in <b>${activeCat}</b> — showing all categories</div>`:'';
  }
  if(!activeCat)hits=SKU_INDEX.filter(matchFn).slice(0,12);
  if(!hits.length){box.innerHTML='<div style="padding:10px 14px;font-size:12px;color:#94a3b8">No results</div>';box.style.display='block';return;}
  box.innerHTML=scopeNote+'<div style="padding:6px 8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px">'+hits.map(s=>{
    const mtdClr=s.vs_lmtd==null?'#94a3b8':s.vs_lmtd>=5?'#16a34a':s.vs_lmtd>0?'#65a30d':s.vs_lmtd>-5?'#d97706':'#dc2626';
    const mtdTxt=s.vs_lmtd!=null?(s.vs_lmtd>=0?'+':'')+s.vs_lmtd.toFixed(1)+'% MTD':'—';
    const wowTxt=s.wow!=null?(s.wow>=0?'+':'')+s.wow.toFixed(1)+'% WoW':'—';
    const wowClr=s.wow==null?'#94a3b8':s.wow>=0?'#16a34a':'#dc2626';
    const borderClr=s.is_own?'#3b82f6':s.vs_lmtd==null?'#e2e8f0':s.vs_lmtd>=2?'#22c55e':s.vs_lmtd>0?'#86efac':s.vs_lmtd>-2?'#fbbf24':'#ef4444';
    const bgClr=s.is_own?'#eff6ff':s.vs_lmtd==null?'#fff':s.vs_lmtd>=0?'#f0fdf4':'#fff5f5';
    return `<a href="https://blinkit.com/prn/dp/prid/${s.pid}" target="_blank"
      style="display:block;text-decoration:none;background:${bgClr};border:1px solid #e2e8f0;border-left:4px solid ${borderClr};border-radius:7px;padding:9px 11px;transition:box-shadow .1s"
      onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,.08)'" onmouseout="this.style.boxShadow='none'">
      <div style="font-size:11px;font-weight:700;color:${s.is_own?'#1d4ed8':'#0f172a'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px">
        ${s.display}${s.is_own?' <span style="font-size:9px;background:#dbeafe;color:#1d4ed8;padding:1px 4px;border-radius:3px">★ us</span>':''}
      </div>
      <div style="font-size:10px;color:#64748b;margin-bottom:6px">${s.dispBrand} · ${s.cat} · PID ${s.pid}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
        ${s.avg?`<span style="font-size:10px;background:#f1f5f9;color:#334155;padding:2px 8px;border-radius:5px;font-weight:700">${fU(s.avg)}/day</span>`:''}
        <span style="font-size:10px;background:${s.vs_lmtd==null?'#f1f5f9':s.vs_lmtd>=0?'#dcfce7':'#fee2e2'};color:${mtdClr};padding:2px 8px;border-radius:5px;font-weight:700;border:1px solid ${s.vs_lmtd==null?'#e2e8f0':s.vs_lmtd>=0?'#bbf7d0':'#fecaca'}">${mtdTxt}</span>
        <span style="font-size:10px;background:${s.wow==null?'#f1f5f9':s.wow>=0?'#dcfce7':'#fee2e2'};color:${wowClr};padding:2px 8px;border-radius:5px;font-weight:600">${wowTxt}</span>
        ${s.mkt_sh?`<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:5px;font-weight:600">${s.mkt_sh.toFixed(1)}% mkt sh</span>`:''}
        ${s.ppu?`<span style="font-size:10px;color:#94a3b8;padding:2px 4px">₹${s.ppu}/100ml</span>`:''}
      </div>
    </a>`;
  }).join('')+'</div>';
  box.style.display='block';
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#sku-search')&&!e.target.closest('#search-results'))
    document.getElementById('search-results').style.display='none';
});
window.onload=init;
